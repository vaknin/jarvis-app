[package]
name = "jarvis-ffi"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "jarvis_ffi"

[[bin]]
# Generates the Kotlin bindings from the built library: `cargo run -p jarvis-ffi --bin uniffi-bindgen`.
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
jarvis-core = { path = "../core" }
jarvis-voice = { path = "../voice" }
uniffi = "0.32.2"
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
# The forum tunnel (src/forum.rs).
iroh.workspace = true
iroh-tickets = "1"
futures-util = "0.3"
# App updates through the tunnel (forum.rs).
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "0.4.1"
