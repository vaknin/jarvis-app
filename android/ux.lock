# The Android app's UX lock: what Aviv agreed to lose from the phone app, in his words, so it isn't
# brought back or taken for a mistake. It follows tabs/tui/ux.lock in the jarvis repo; there's no
# contract test behind this one yet. An entry he agreed to lose stays here with that line.

removed flow android-reply-button
  what: Each answer had a Reply button that opened a page for that one answer, to write under its paragraphs. A swipe on a paragraph, a hold to mark and held replies do that job now.
  approved: 2026-11-01 "No, the reply button can go. I will never use it, as I already can."

removed flow android-airpods-call-route
  what: For now a call with the AirPods connected isn't Android's own call: Jarvis plays in them as media and the phone's mic hears him, so that call has no call-style notification and no working route button. A stem press still hangs up. AIRPODS_AS_SPEAKERS in crates/voice/src/rules.rs turns it back.
  approved: 2026-11-02 "I can hear you in the AirPods. speakers. speakers in my ears and you will hear me from the phone. But just as a temporary fix, can we do that quickly?"

removed flow android-call-phone-stt
  what: On a call the phone's own on-device recognizer no longer hears Aviv's turns beside the server's Parakeet (PhoneStt, the hello's "stt":"phone", cut/heard). Parakeet on the server is the only speech to text.
  approved: 2026-11-02 "So we don't need this backup. You can delete it from the code So, yeah, no need for that. Only parakeet."

removed flow android-opens-on-the-wall
  what: The app no longer opens on the wall of tabs: it opens on Needs you, with Digest beside it, and the wall is one tap away (the grid icon top left, Back, or "Your tabs"). The mockup is the jarvis repo's design/autonomy/final.html.
  approved: 2026-11-02 "So So on the about option A, I agree about the phone"
  approved: 2026-11-02 "Yes, I agree"

added flow android-question-dialog
  what: A question opens as a confirmation dialog: Jarvis's recommended answer highlighted, and always a free-text box whose note goes with any answer, or alone.
  approved: 2026-11-02 "make sure it's a nice confirmation box dialogue prompt and that the recommended pick is highlighted ... and perhaps always add like a box that I can type free text into it."

added flow android-card-note-line
  what: Every card on Needs you, and in its tab, has its own note line, so he can answer Yes or No with a remark without opening the dialog.
  approved: 2026-11-02 "I want to be able to say as an example yes but also add like a note or a remark which is not present in this mock-up"

added flow android-auto-button
  what: Autopilot is option B: an "Auto" button next to Call in a tab's box, and the same between Mute and End on that tab's call screen. Until the server builds autopilot it says so in a line.
  approved: 2026-11-02 "Now I like B. You can tell the tab that I went with B, which is what I pressed by mistake, but I actually want it anyway."

added flow android-issues-bar
  what: Under Jarvis 2.0 a tab's jobs line becomes its issues bar: one segment per issue, each filled by its own step, with "2 of 5 done" (and "held" under the usage freeze); past 8 it shows the most recent open ones. A tap opens the tab's issues as a sheet (the phone's alt+j), and a tap on an issue shows why it's where it is. Without 2.0 the jobs line stays as it was.
  approved: 2026-11-06 "agreed"
  approved: 2026-11-06 "I already agree. you can drop the pages and continue with executing"

added flow android-done-line
  what: Under Jarvis 2.0 a "✅ Done:" answer has its headline in bold and its last line, how long it took and where, small and dim.
  approved: 2026-11-06 "agreed"

removed flow android-tab-row
  what: Under the library fold (behind its switch until the switch stage) there's no wall of tabs, no tab row and no Needs you list: one main chat where he talks, and a thread per subject that works and reports back to it. Threads (alt+l) lists them, + or alt+n opens one at once (his first line names it), alt+1..9 opens thread N. Mockup: jarvis-picks/fold-home-tabs.html, option A.
  approved: 2026-11-07 "Yes, main chat and threads"
  approved: 2026-11-07 "yes, but not as tabs / we don't want tabs"

added flow android-fold-report-look
  what: In the main chat a finished report is one calm grey line, and a card waiting on him is an orange-edged block with its answers as buttons. Out of view, a small jump chip counts only cards still waiting for his answer; finished reports never remind, an unread one keeps a small dot until seen. Mockup: jarvis-picks/fold-home-look.html, the in-view look and A3.
  approved: 2026-11-08 "I like A3"
  approved: 2026-11-08 "for cards it makes sense that i didn't reply yet and you 'remind' me / but how would we do that for reports? perhaps skip it, and do it only for cards waiting for my answer?"

added flow android-fold-progress-bars
  what: Threads show Iris's step blocks in the list and at the top of a thread: grey done, sky blue running, orange needs him, a hollow outline still to come (Okabe-Ito, protan-safe), with words beside them, never colour alone. Mockup: jarvis-picks/fold-progress-bars.html, option A.
  approved: 2026-11-07 "Progress bars for threads - let's go with 'A', but use protan colorblind friendly colors instead"
