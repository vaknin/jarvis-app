[workspace]
resolver = "3"
members = ["crates/core", "crates/daemon", "crates/ffi", "crates/voice"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
iroh = "1.3"
iroh-mdns-address-lookup = "0.6"
tokio = { version = "1.53", features = ["full"] }
rusqlite = { version = "0.40", features = ["bundled"] }
postcard = { version = "1.1", features = ["use-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.26", features = ["v4", "serde"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.11"
rand = "0.10"
data-encoding = "2.11"
tempfile = "3.27"
